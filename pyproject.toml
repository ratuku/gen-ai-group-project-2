[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-assistant"
version = "0.1.0"
description = "An autonomous CLI coding assistant built around MCP tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "echo_mcp_server",
    "test_architecture",
    "test_mcp_client",
    "test_mcp_config",
    "test_filesystem_mcp_windows",
]
disallow_untyped_decorators = false
